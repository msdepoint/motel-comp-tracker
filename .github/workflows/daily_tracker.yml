name: Daily Competitor Tracker

on:
  schedule:
    # Runs daily at 09:00 UTC (05:00 AM EDT / 04:00 AM EST)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual on-demand execution from GitHub UI

permissions:
  contents: write

jobs:
  track-competitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Run Harpers Riverside Motel Comp Scraper & Analytics
        run: |
          python tracker.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated daily snapshot: $(date -u +'%Y-%m-%d')"
            git push
          fi
